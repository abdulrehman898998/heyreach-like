version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: heyreach-postgres
    environment:
      POSTGRES_DB: heyreach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heyreach-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: heyreach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heyreach-network

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: heyreach-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - heyreach-network

  # MCP Service (placeholder)
  mcp:
    image: node:18-alpine
    container_name: heyreach-mcp
    working_dir: /app
    volumes:
      - ../apps/worker:/app
    command: echo "MCP service placeholder - implement your MCP service here"
    networks:
      - heyreach-network

  # Web API Service
  web-api:
    build:
      context: ..
      dockerfile: apps/web-api/Dockerfile
    container_name: heyreach-web-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/heyreach
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: heyreach-artifacts
      S3_REGION: us-east-1
      APP_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      COOKIE_ENC_KEY_BASE64: ${COOKIE_ENC_KEY_BASE64:-}
      PLAYWRIGHT_HEADLESS: true
      DEFAULT_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
      DEFAULT_TIMEZONE: Europe/London
      DEFAULT_LOCALE: en-GB
      MCP_URL: http://mcp:8080/analyze
      MCP_API_KEY: ${MCP_API_KEY:-}
      REQUIRE_RESIDENTIAL: true
      ALLOW_MOBILE: true
      ALLOW_DATACENTER: false
      ASN_DENYLIST: 16509,13335,15169,16276,14061,14618
      IP_INTEL_CACHE_TTL: 1800
      PROXY_HEALTH_TIMEOUT_MS: 2500
      MAX_PROXY_ROTATIONS_PER_24H: 1
      RISK_PAUSE_THRESHOLD: 60
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - heyreach-network

  # Worker Service
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: heyreach-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/heyreach
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: heyreach-artifacts
      S3_REGION: us-east-1
      PLAYWRIGHT_HEADLESS: true
      DEFAULT_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
      DEFAULT_TIMEZONE: Europe/London
      DEFAULT_LOCALE: en-GB
      MCP_URL: http://mcp:8080/analyze
      MCP_API_KEY: ${MCP_API_KEY:-}
      REQUIRE_RESIDENTIAL: true
      ALLOW_MOBILE: true
      ALLOW_DATACENTER: false
      ASN_DENYLIST: 16509,13335,15169,16276,14061,14618
      IP_INTEL_CACHE_TTL: 1800
      PROXY_HEALTH_TIMEOUT_MS: 2500
      MAX_PROXY_ROTATIONS_PER_24H: 1
      RISK_PAUSE_THRESHOLD: 60
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
    shm_size: 2gb
    networks:
      - heyreach-network

  # Frontend Service (optional)
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: heyreach-frontend
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - web-api
    networks:
      - heyreach-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  heyreach-network:
    driver: bridge
