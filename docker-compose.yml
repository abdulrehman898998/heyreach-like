version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: heyreach-postgres
    environment:
      POSTGRES_DB: heyreach
      POSTGRES_USER: heyreach_user
      POSTGRES_PASSWORD: heyreach_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heyreach_user -d heyreach"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: heyreach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HeyReach Application
  heyreach-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heyreach-app
    environment:
      # Database
      DATABASE_URL: postgresql://heyreach_user:heyreach_password@postgres:5432/heyreach
      # Redis
      REDIS_URL: redis://redis:6379
      # Playwright
      PLAYWRIGHT_HEADLESS: true
      # Optional: LLM API
      LLM_API_KEY: your_openai_api_key_here
      LLM_API_URL: https://api.openai.com/v1/chat/completions
      # Optional: Encryption
      ENCRYPTION_KEY: your_32_character_encryption_key_here
      SESSION_SECRET: your_session_secret_here
    ports:
      - "5002:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots

volumes:
  postgres_data:
  redis_data:
